# Release 发布或编辑后，把最新正式版同步到官网并重建 GitHub Pages。
name: 官网更新日志

on:
  repository_dispatch:
    types: [release-site-refresh]
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echo-player-site-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: 读取最新正式版
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            > "$RUNNER_TEMP/latest-release.json"; then
            touch "$RUNNER_TEMP/release-found"
            exit 0
          fi
          STABLE_COUNT="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp \
            --jq '[.[][] | select(.draft == false and .prerelease == false)] | length')"
          test "$STABLE_COUNT" = "0"

      - name: 生成官网更新日志
        run: |
          ./scripts/site_release_sync_test.sh
          if [ -f "$RUNNER_TEMP/release-found" ]; then
            ./scripts/sync_site_release.sh \
              "$RUNNER_TEMP/latest-release.json" \
              docs/release.json
          else
            jq -S -n '{schema: 1, status: "unavailable"}' > docs/release.json
          fi

      - name: 提交官网数据
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/release.json; then
            echo "官网更新日志已是最新版"
            exit 0
          fi
          FILE_SHA="$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/docs/release.json?ref=main" \
            --jq .sha)"
          CONTENT="$(base64 --wrap=0 docs/release.json)"
          jq -n \
            --arg message "官网：同步更新日志" \
            --arg content "$CONTENT" \
            --arg sha "$FILE_SHA" \
            '{message: $message, content: $content, sha: $sha, branch: "main"}' \
            > "$RUNNER_TEMP/site-release-update.json"
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/docs/release.json" \
            --input "$RUNNER_TEMP/site-release-update.json" \
            --silent

      - name: 重新构建官网
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
