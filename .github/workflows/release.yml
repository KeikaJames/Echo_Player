# 发版工作流：推送 v* 形式的 tag 即自动构建并发布 Release。
#
#   git tag v1.1 && git push origin v1.1
#
# 产物：Echo.Player.<tag>.zip（内含 Echo Player.app），发布说明自动附带
# SHA256 指纹——应用内更新器下载后会比对这个指纹，防篡改/防传错。
#
# 说明：
# - 构建需要 Xcode 26（macOS 26 SDK）。若 GitHub 托管 runner 尚未提供该镜像，
#   此工作流会失败——届时在本机跑 scripts 里同样的四步，手动 `gh release create` 即可。
# - Whisper 模型（约 465MB）会在 CI 里从 Hugging Face 拉取后打进包（开箱即用）；
#   拉取或校验失败会终止发版。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build-release:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: 校验版本标签
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo "无效版本标签：$RELEASE_TAG" >&2
            exit 1
          }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: 选择 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 内置 Whisper 模型
        env:
          MODEL_REVISION: 97a5bf9bbc74c7d9c12c755d04dea59e672e3808
        run: |
          export GIT_LFS_SKIP_SMUDGE=1
          MODEL_DIR="$RUNNER_TEMP/whisperkit-coreml"
          git clone --filter=blob:none --no-checkout \
            https://huggingface.co/argmaxinc/whisperkit-coreml "$MODEL_DIR"
          git -C "$MODEL_DIR" checkout --detach "$MODEL_REVISION"
          git -C "$MODEL_DIR" lfs pull \
            --include="openai_whisper-small/**" --exclude=""
          test -f "$MODEL_DIR/openai_whisper-small/config.json"
          test -f "$MODEL_DIR/openai_whisper-small/MelSpectrogram.mlmodelc/coremldata.bin"
          test -f "$MODEL_DIR/openai_whisper-small/AudioEncoder.mlmodelc/coremldata.bin"
          test -f "$MODEL_DIR/openai_whisper-small/TextDecoder.mlmodelc/coremldata.bin"
          mkdir -p "LyricPlayer/Resources/WhisperModel"
          mv "$MODEL_DIR/openai_whisper-small" "LyricPlayer/Resources/WhisperModel/"

      - name: 运行测试
        run: |
          ECHO_DERIVED_DATA="$GITHUB_WORKSPACE/build" \
            ./scripts/format_regression.sh test

      - name: 构建 Release
        run: |
          ECHO_DERIVED_DATA="$GITHUB_WORKSPACE/build" \
          RELEASE_MARKETING_VERSION="${RELEASE_TAG#v}" \
          RELEASE_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            ./scripts/format_regression.sh universal

      - name: 打包 + 指纹
        run: |
          cd build/Build/Products/Release
          mv LyricPlayer.app "Echo Player.app"
          ditto -c -k --keepParent "Echo Player.app" "Echo.Player.${RELEASE_TAG}.zip"
          HASH=$(shasum -a 256 "Echo.Player.${RELEASE_TAG}.zip" | cut -d' ' -f1)
          echo "$HASH" > "Echo.Player.${RELEASE_TAG}.zip.sha256"

      - name: 保存待发布产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          path: |
            build/Build/Products/Release/Echo.Player.*.zip
            build/Build/Products/Release/Echo.Player.*.zip.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    needs: build-release
    runs-on: macos-26
    permissions:
      actions: read
      contents: write
    steps:
      - name: 下载并发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_DIR="$RUNNER_TEMP/release-package"
          ZIP_NAME="Echo.Player.${RELEASE_TAG}.zip"
          mkdir -p "$RELEASE_DIR"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name release-package \
            --dir "$RELEASE_DIR"
          test -f "$RELEASE_DIR/$ZIP_NAME"
          test -f "$RELEASE_DIR/$ZIP_NAME.sha256"
          EXPECTED=$(tr -d '[:space:]' < "$RELEASE_DIR/$ZIP_NAME.sha256")
          ACTUAL=$(shasum -a 256 "$RELEASE_DIR/$ZIP_NAME" | cut -d' ' -f1)
          test "$ACTUAL" = "$EXPECTED"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            --jq .body \
            > "$RUNNER_TEMP/generated-notes.md"
          {
            echo "SHA256: $ACTUAL"
            echo ""
            echo "# Echo Player $RELEASE_TAG"
            echo ""
            cat "$RUNNER_TEMP/generated-notes.md"
            echo ""
            echo "## 安装"
            echo "首次安装请看官网教程（未签名应用需右键→打开）：https://keikajames.github.io/Echo_Player/"
            echo "已安装用户无需操作——应用会自动提示更新。"
          } > "$RUNNER_TEMP/release-notes.md"
          RELEASE_STATE="$RUNNER_TEMP/existing-release.json"
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,body,assets > "$RELEASE_STATE" 2>/dev/null; then
            if [ "$(jq -r .isDraft "$RELEASE_STATE")" = "true" ]; then
              gh release upload "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                "$RELEASE_DIR/$ZIP_NAME" \
                --clobber
              gh release edit "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Echo Player $RELEASE_TAG" \
                --notes-file "$RUNNER_TEMP/release-notes.md" \
                --draft=false
            else
              jq -e --arg zip "$ZIP_NAME" '
                ((.body // "") | test("(^|\\n)SHA256: [0-9a-fA-F]{64}(\\n|$)")) and
                any((.assets // [])[]; .name == $zip and .size > 0)
              ' "$RELEASE_STATE" >/dev/null
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "$RELEASE_DIR/$ZIP_NAME" \
              --title "Echo Player $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=release-site-refresh
